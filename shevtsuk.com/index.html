<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shevtsuk.com - Coming soon</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #08090c;
    color: #e6e8ec;
    min-height: 100dvh;
    position: relative;
    overflow: hidden;
  }

  .portrait {
    position: fixed;
    top: 0;
    right: 0;
    height: 100dvh;
    width: 60vw;
    max-width: 46rem;
    overflow: hidden;
  }

  .portrait img {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: auto;
    max-width: none;
    /* the face's vertical axis sits at the source image's horizontal center;
       pin that line to the panel's left edge so it reads as an exact half-face */
    object-fit: cover;
    object-position: left center;
    filter: grayscale(1) contrast(1.05);
  }

  .portrait::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #08090c 0%, rgba(8, 9, 12, 0) 22%);
  }

  .content {
    position: relative;
    z-index: 1;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 34rem;
    padding: 2rem clamp(1.5rem, 6vw, 4.5rem);
  }

  h1 {
    font-size: clamp(1.3rem, 2.6vw, 2.1rem);
    font-weight: 500;
    font-style: italic;
    margin: 0 0 0.6rem;
    letter-spacing: -0.01em;
    line-height: 1.3;
    color: #e6e8ec;
  }
  h1::before { content: "\201C"; }
  h1::after { content: "\201D"; }

  .attribution {
    font-size: 0.85rem;
    color: #6b7280;
    margin: 0 0 2rem;
  }
  .attribution:empty {
    margin: 0 0 1.4rem;
  }

  p {
    margin: 0;
    color: #9aa1ac;
    font-size: 1.05rem;
    line-height: 1.5;
    max-width: 28rem;
  }

  .contact {
    margin-top: 3.5rem;
  }

  @media (max-width: 760px) {
    body {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .portrait {
      position: relative;
      order: 2;
      width: 100%;
      max-width: none;
      height: 46dvh;
      top: auto;
      right: auto;
      flex-shrink: 0;
    }
    .portrait img {
      width: 100%;
      height: 100%;
      object-position: center 18%;
    }
    .portrait::after {
      display: none;
    }
    .content {
      display: contents;
    }
    .quote-block {
      order: 1;
      padding: 2.5rem clamp(1.5rem, 6vw, 3rem) 1.5rem;
      text-align: center;
    }
    .contact {
      order: 3;
      margin-top: 0;
      padding: 1.5rem clamp(1.5rem, 6vw, 3rem) 2.5rem;
      text-align: center;
    }
  }
</style>
</head>
<body>
  <div class="portrait">
    <img src="Dimka.jpeg" alt="">
  </div>
  <div class="content">
    <div class="quote-block">
      <h1 id="quote"></h1>
      <p class="attribution" id="attribution"></p>
    </div>
    <p class="contact">If you need to reach me, you already know how.</p>
  </div>

  <script>
    var QUOTES = [
      { text: "When something is important enough, you do it even if the odds are not in your favor.", by: "Elon Musk" },
      { text: "Persistence is very important. You should not give up unless you are forced to give up.", by: "Elon Musk" },
      { text: "Failure is an option here. If things are not failing, you are not innovating enough.", by: "Elon Musk" },
      { text: "I think it is possible for ordinary people to choose to be extraordinary.", by: "Elon Musk" },
      { text: "Take risks now and do something bold.", by: "Elon Musk" },
      { text: "Constantly think about how you could be doing things better.", by: "Elon Musk" },
      { text: "Make it happen." },
      { text: "Stay hungry. Stay foolish." },
      { text: "Nothing changes if nothing changes." },
      { text: "Difficult roads lead to beautiful places." },
      { text: "Dream big. Start small." },
      { text: "Do it scared." },
      { text: "Your future needs you. Your past doesn't." },
      { text: "Be stronger than your excuses." },
      { text: "Small steps still move you forward." },
      { text: "Focus on progress, not perfection." },
      { text: "You become what you believe." },
      { text: "Growth begins outside your comfort zone." },
      { text: "If you want different results, make different choices." },
      { text: "Don't fear failure. Fear never trying." },
      { text: "One day or day one. You decide." },
      { text: "The best way out is always through." },
      { text: "Your direction matters more than your speed." },
      { text: "A clear mind makes better choices." },

      { text: "A bad day is not a bad life." },

    var pick = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    document.getElementById("quote").textContent = pick.text;
    document.getElementById("attribution").textContent = pick.by ? "- " + pick.by : "";
  </script>
</body>
</html>
